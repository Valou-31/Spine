[package]
name = "spine"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
notify = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
rfd = "0.15"
tray-icon = "0.25.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSRunningApplication"] }
xattr = "1.6.1"
plist = "1.10.1"

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
